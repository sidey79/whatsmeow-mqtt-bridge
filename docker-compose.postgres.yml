services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsmeow_bridge
      POSTGRES_USER: whatsmeow_bridge
      POSTGRES_PASSWORD_FILE: /run/secrets/whatsmeow_db_password
    secrets:
      - whatsmeow_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bridge:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WA_DB_DRIVER: postgres
      WA_DB_HOST: postgres
      WA_DB_PORT: "5432"
      WA_DB_NAME: whatsmeow_bridge
      WA_DB_USER: whatsmeow_bridge
      WA_DB_PASSWORD_FILE: /run/secrets/whatsmeow_db_password
      WA_DB_SSLMODE: disable
    secrets:
      - whatsmeow_db_password

secrets:
  whatsmeow_db_password:
    file: ./secrets/whatsmeow_db_password

volumes:
  postgres-data:
