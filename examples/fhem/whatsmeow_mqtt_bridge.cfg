# MQTT2_DEVICE example for MQTT_BASE_TOPIC=whatsapp.
# Adjust IODev if the MQTT2 server has a different FHEM device name.
defmod whatsmeow_mqtt_bridge MQTT2_DEVICE whatsmeow_mqtt_bridge
attr whatsmeow_mqtt_bridge IODev MQTT2_FHEM_Server
attr whatsmeow_mqtt_bridge readingList whatsmeow_mqtt_bridge:whatsapp/event/status:.* { json2nameValue($EVENT, 'status_', $JSONMAP) }\
whatsmeow_mqtt_bridge:whatsapp/event/message:.* { json2nameValue($EVENT, 'message_', $JSONMAP) }\
whatsmeow_mqtt_bridge:whatsapp/event/delivery:.* { json2nameValue($EVENT, 'delivery_', $JSONMAP) }\
whatsmeow_mqtt_bridge:whatsapp/event/error:.* { json2nameValue($EVENT, 'error_', $JSONMAP) }
attr whatsmeow_mqtt_bridge room system->MQTT2_DEVICE
attr whatsmeow_mqtt_bridge setList sendText:textField { my (undef,$to,$text)=split(/\s+/,$EVENT,3);; my $unicode=utf8::is_utf8($text)?$text:Encode::decode_utf8($text);; return "whatsapp/cmd/send/text ".JSON::PP::encode_json({requestId=>"fhem-".time()."-".int(rand(1000000)),to=>$to,payload=>{text=>$unicode}});; }
attr whatsmeow_mqtt_bridge userattr msgContactPush msgCmdPush msgCmdPushHigh msgCmdPushLow
attr whatsmeow_mqtt_bridge msgContactPush whatsmeow_mqtt_bridge
attr whatsmeow_mqtt_bridge msgCmdPush set %DEVICE% sendText %RECIPIENT% %MSG%
attr whatsmeow_mqtt_bridge msgCmdPushHigh set %DEVICE% sendText %RECIPIENT% %MSG%
attr whatsmeow_mqtt_bridge msgCmdPushLow set %DEVICE% sendText %RECIPIENT% %MSG%
